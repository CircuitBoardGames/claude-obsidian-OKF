# RUNS ON A SELF-HOSTED DEBIAN RUNNER, NOT GITHUB'S HOSTED IMAGES.
#
# This fork's CI is executed by the CircuitBoardGames Forgejo runner (Debian 13, one machine). The
# workflow it inherited was written for GitHub's hosted fleet and could not pass here at all:
#
#   * `actions/setup-python` failed every Ubuntu job before a single test ran --
#     `The version '3.11' with architecture 'x64' was not found for Debian 13` -- because that
#     action resolves against a manifest of prebuilt images this runner does not use.
#   * `macos-latest` and `windows-latest` have no runner, so those jobs sat PENDING for ever. A job
#     that can never complete is worse than one that fails: the PR simply never goes green, and
#     nothing says why.
#
# A gate that cannot pass is as useless as one that cannot fail, and it is the same defect wearing
# the opposite sign. Fixed against what demonstrably passes on this runner rather than against a
# guess: the consuming repo's own workflows use the system interpreter and `uv`, and use
# `setup-python` NOWHERE.
#
# WHAT THIS COSTS, STATED RATHER THAN HIDDEN. The Python version matrix and the macOS/Windows
# surfaces are GONE here. They are not lost -- they belong to upstream's GitHub CI, which runs on
# the fleet that can serve them. This fork's gate now answers one narrower question honestly: does
# the hermetic suite pass on the interpreter this fork is actually vendored and run against?
# Re-adding a matrix here needs interpreters the runner can supply, which was not verified from an
# Alpine box and must not be assumed.

name: Hermetic verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: hermetic suite (self-hosted Debian, system Python)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # NO setup-python. It is what broke every Ubuntu job here, and the runner already carries a
      # system interpreter -- the same one this fork is vendored against and run with in practice.
      - name: Show runtime versions
        run: |
          python3 --version
          bash --version | head -1

      - name: Run hermetic suite and executable contracts
        run: make test

      - name: Prove tests did not mutate or create product files
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  # windows-smoke: REMOVED, not skipped. There is no windows-latest runner here, so the job sat
  # PENDING for ever and the PR could never go green. Upstream's GitHub CI still runs the portable
  # surface on Windows; deleting it here loses no coverage that this runner could ever have
  # provided, and it stops a permanently-pending job from masquerading as work in progress.

  release-safety:
    name: Reproducible release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: test
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # NO setup-python, for the reason given at the top of this file.
      - name: Build and audit the public artifact twice
        run: |
          python3 scripts/claude-obsidian.py release build --output "$RUNNER_TEMP/first.zip"
          python3 scripts/claude-obsidian.py release build --output "$RUNNER_TEMP/second.zip"
          cmp "$RUNNER_TEMP/first.zip" "$RUNNER_TEMP/second.zip"
          python3 scripts/claude-obsidian.py release audit "$RUNNER_TEMP/first.zip"
